<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="716" viewBox="0 0 1136 716">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1976c9"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8e44ad"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d64535"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e66a00"/></marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b6f00"/></marker>
    <style>
      .title{font:700 24px Arial,Helvetica,sans-serif;fill:#111}.sub{font:13px Arial,Helvetica,sans-serif;fill:#111}
      .box-title{font:700 13px Arial,Helvetica,sans-serif;fill:#111}.txt{font:12px Arial,Helvetica,sans-serif;fill:#111}.small{font:11px Arial,Helvetica,sans-serif;fill:#111}
      .box{rx:16;ry:16;stroke-width:1.2}.blue{stroke:#1976c9;fill:#eaf4ff}.gray{stroke:#5b6c7c;fill:#f4f6f8}.orange{stroke:#ff6d00;fill:#fff3e8}.green{stroke:#20a65a;fill:#eaf8ef}.yellow{stroke:#d5a100;fill:#fff8dc}.purple{stroke:#8e44ad;fill:#f3eaf8}.red{stroke:#e53935;fill:#fff0f0}
      .wire-blue{stroke:#1976c9;stroke-width:2.2;fill:none;marker-end:url(#arrow-blue)}.wire-purple{stroke:#8e44ad;stroke-width:2.2;fill:none;marker-end:url(#arrow-purple)}.wire-red{stroke:#d64535;stroke-width:2.1;fill:none;stroke-dasharray:10 7;marker-end:url(#arrow-red)}.wire-orange{stroke:#e66a00;stroke-width:2.1;fill:none;stroke-dasharray:10 7;marker-end:url(#arrow-orange)}.wire-gold{stroke:#8b6f00;stroke-width:2.1;fill:none;marker-end:url(#arrow-gold)}
    </style>
  </defs>

  <text x="22" y="29" class="title">Fizikai felépítés – palackozóüzem-makett hibamenedzsment rendszere</text>
  <text x="22" y="53" class="sub">ESP-k, AGV Raspberry Pi, hálózat, RFID olvasók és fizikai hibageneráló kapcsolók</text>

  <rect x="0" y="120" width="300" height="135" class="box gray"/>
  <text x="150" y="164" text-anchor="middle" class="box-title">Fejlesztői / kezelői PC</text>
  <text x="150" y="193" text-anchor="middle" class="txt">böngésző + .NET alkalmazások</text>
  <text x="150" y="208" text-anchor="middle" class="txt">DiagnoseDashboard / DiagnoseService</text>
  <text x="150" y="223" text-anchor="middle" class="txt">FactorySimulation / FactoryService</text>
  <text x="150" y="238" text-anchor="middle" class="txt">SQL Server adatbázis</text>

  <rect x="455" y="86" width="250" height="105" class="box blue"/>
  <text x="580" y="122" text-anchor="middle" class="box-title">FMS Wi‑Fi / LAN</text>
  <text x="580" y="137" text-anchor="middle" class="txt">MQTT broker</text>
  <text x="580" y="152" text-anchor="middle" class="txt">közös hálózati réteg</text>
  <text x="580" y="167" text-anchor="middle" class="txt">IP: 192.168.0.100</text>

  <rect x="20" y="329" width="280" height="125" class="box orange"/>
  <text x="160" y="374" text-anchor="middle" class="box-title">AGV kocsi – Raspberry Pi</text>
  <text x="160" y="389" text-anchor="middle" class="txt">vonalkövetés és motorvezérlés</text>
  <text x="160" y="404" text-anchor="middle" class="txt">palackok szállítása</text>
  <text x="160" y="419" text-anchor="middle" class="txt">3 kocsi vezérlő kapcsoló</text>

  <rect x="35" y="561" width="250" height="75" class="box yellow"/>
  <text x="160" y="589" text-anchor="middle" class="box-title">Palack / üveg LED-ek</text>
  <text x="160" y="606" text-anchor="middle" class="txt">szállított palackok vizuális állapota</text>
  <text x="160" y="621" text-anchor="middle" class="txt">3D nyomtatott üvegtartó</text>

  <rect x="445" y="329" width="270" height="120" class="box green"/>
  <text x="580" y="374" text-anchor="middle" class="box-title">Tartály ESP</text>
  <text x="580" y="389" text-anchor="middle" class="txt">tartály LED-ek</text>
  <text x="580" y="404" text-anchor="middle" class="txt">állapotüzenetek</text>
  <text x="580" y="419" text-anchor="middle" class="txt">áram megszakítható kapcsolóval</text>

  <rect x="445" y="610" width="270" height="105" class="box red"/>
  <text x="580" y="647" text-anchor="middle" class="box-title">Kapcsolópanel</text>
  <text x="580" y="663" text-anchor="middle" class="txt">6 kapcsoló összesen</text>
  <text x="580" y="678" text-anchor="middle" class="txt">3 kocsi vezérlés</text>
  <text x="580" y="693" text-anchor="middle" class="txt">3 fizikai hiba: 2 RFID + tartály ESP</text>

  <rect x="810" y="194" width="285" height="135" class="box purple"/>
  <text x="952" y="243" text-anchor="middle" class="box-title">RFID ESP</text>
  <text x="952" y="258" text-anchor="middle" class="txt">2 × MFRC522 olvasó</text>
  <text x="952" y="273" text-anchor="middle" class="txt">heartbeat + reader státusz</text>
  <text x="952" y="288" text-anchor="middle" class="txt">rakományazonosító és egyezés</text>

  <rect x="785" y="470" width="157" height="76" class="box purple"/>
  <text x="864" y="498" text-anchor="middle" class="box-title">Tank RFID olvasó</text>
  <text x="864" y="514" text-anchor="middle" class="txt">TANK rakomány</text>
  <text x="864" y="529" text-anchor="middle" class="txt">áram megszakítható</text>

  <rect x="980" y="470" width="157" height="76" class="box purple"/>
  <text x="1059" y="498" text-anchor="middle" class="box-title">Warehouse RFID olvasó</text>
  <text x="1059" y="514" text-anchor="middle" class="txt">WH rakomány</text>
  <text x="1059" y="529" text-anchor="middle" class="txt">áram megszakítható</text>

  <path d="M300 188 L330 188 L424 137 L455 137" class="wire-blue"/>
  <text x="315" y="176" class="small">REST / helyi appok</text>
  <path d="M425 138 L330 391 L300 391" class="wire-blue"/>
  <text x="315" y="305" class="small">AGV állapot / vezérlés</text>
  <path d="M580 191 L580 294" class="wire-blue"/>
  <text x="545" y="264" class="small">MQTT állapot</text>
  <path d="M705 138 L952 138 L952 194" class="wire-blue"/>
  <text x="805" y="142" class="small">MQTT: RFID topicok</text>

  <path d="M952 329 L952 399 L864 399 L864 470" class="wire-purple"/>
  <path d="M952 329 L952 399 L1059 399 L1059 470" class="wire-purple"/>
  <text x="862" y="402" class="small">SPI</text>
  <text x="998" y="402" class="small">SPI</text>

  <path d="M160 454 L160 561" class="wire-purple"/>
  <text x="124" y="513" class="small">palackok / LED</text>

  <path d="M580 610 L580 449" class="wire-red"/>
  <text x="535" y="535" class="small">áram megszakítás</text>
  <path d="M715 662 L864 662 L864 546" class="wire-red"/>
  <path d="M715 662 L1059 662 L1059 546" class="wire-red"/>
  <text x="818" y="626" class="small">áram megszakítás</text>
  <text x="1016" y="626" class="small">áram megszakítás</text>
  <path d="M445 662 L414 662 L329 391 L300 391" class="wire-orange"/>
  <text x="314" y="531" class="small">kocsi vezérlő kapcsolók</text>
</svg>
