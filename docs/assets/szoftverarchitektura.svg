<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="780" viewBox="0 0 1136 780">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:24px;font-weight:700}.sub{font-size:13px}.h{font-size:15px;font-weight:700}.t{font-size:12px}.box{rx:18;ry:18;stroke-width:1.4}.ui{stroke:#5b6c7c;fill:#f7f9fa}.be{stroke:#1976c9;fill:#eaf4ff}.br{stroke:#18a558;fill:#eaf8ef}.dev{stroke:#8e44ad;fill:#f4eaf8}.db{stroke:#e53935;fill:#fff0f0}.wire{stroke:#34495e;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  </defs>
  <text x="2" y="30" class="title">Szoftverarchitektúra – modulok és kommunikáció</text>
  <text x="2" y="53" class="sub">Blazor dashboard, diagnosztikai service, gyárszimuláció, MQTT broker és beágyazott kliensek</text>

  <rect x="5" y="86" width="310" height="260" class="box ui"/>
  <text x="160" y="145" text-anchor="middle" class="h">FactorySimulation</text>
  <text x="160" y="165" text-anchor="middle" class="t">vezérlő UI, ControlPanel</text>
  <text x="160" y="265" text-anchor="middle" class="h">DiagnoseDashboard</text>
  <text x="160" y="285" text-anchor="middle" class="t">hibák, RFID panel, ROOTFAULT</text>

  <rect x="410" y="76" width="310" height="340" class="box be"/>
  <text x="565" y="135" text-anchor="middle" class="h">FactoryService</text>
  <text x="565" y="155" text-anchor="middle" class="t">REST API, diagnózis publikálás</text>
  <text x="565" y="285" text-anchor="middle" class="h">DiagnoseService</text>
  <text x="565" y="305" text-anchor="middle" class="t">MQTTSubscriber, RFID status, heartbeat</text>

  <rect x="805" y="171" width="250" height="110" class="box br"/>
  <text x="930" y="205" text-anchor="middle" class="h">MQTT broker</text>
  <text x="930" y="225" text-anchor="middle" class="t">Diagnoses, RFID topicok, eszközállapotok</text>

  <rect x="766" y="421" width="328" height="250" class="box dev"/>
  <text x="930" y="462" text-anchor="middle" class="h">MQTT kliensek / eszközök</text>
  <text x="930" y="495" text-anchor="middle" class="t">RFID ESP</text>
  <text x="930" y="525" text-anchor="middle" class="t">Tartály ESP</text>
  <text x="930" y="555" text-anchor="middle" class="t">AGV / Pi</text>
  <text x="930" y="585" text-anchor="middle" class="t">Palack ESP</text>

  <rect x="35" y="421" width="250" height="85" class="box" style="stroke:#d5a100;fill:#fff8dc"/>
  <text x="160" y="455" text-anchor="middle" class="h">Dashboard Data réteg</text>
  <text x="160" y="475" text-anchor="middle" class="t">DashboardService + RootCauseAnalyzer</text>

  <rect x="405" y="520" width="315" height="105" class="box db"/>
  <text x="562" y="560" text-anchor="middle" class="h">SQL Server adatbázis</text>
  <text x="562" y="580" text-anchor="middle" class="t">felhasználók, hibaadatok, migrációk</text>

  <path d="M285 160 L440 150" class="wire"/><text x="320" y="151" class="t">REST</text>
  <path d="M285 283 L440 302" class="wire"/><text x="333" y="298" class="t">REST / Refit</text>
  <path d="M690 150 L805 226" class="wire"/><text x="735" y="160" class="t">publish</text>
  <path d="M805 266 L690 303" class="wire"/><text x="720" y="275" class="t">subscribe</text>
  <path d="M930 421 L930 281" class="wire"/><text x="935" y="345" class="t">MQTT</text>
  <path d="M160 326 L160 421" class="wire"/><text x="116" y="378" class="t">állapot kiértékelés</text>
  <path d="M565 355 L565 520" class="wire"/><text x="589" y="438" class="t">adatbázis</text>

  <text x="22" y="750" class="t">Fő adatút: eszköz / ESP → MQTT broker → DiagnoseService → REST/Refit → DashboardService + RootCauseAnalyzer → Dashboard</text>
</svg>
